name: Deploy Preguntados to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Preguntados to InfinityFree
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Create production config
        run: |
          mkdir -p config

          cat > config/config.ini <<'EOF'
          db_host = "${{ secrets.DB_HOST }}"
          db_user = "${{ secrets.DB_USER }}"
          db_pass = "${{ secrets.DB_PASS }}"
          db_name = "${{ secrets.DB_NAME }}"

          base_url = "https://preguntadospw2.infinityfreeapp.com"

          smtp_host = "smtp.gmail.com"
          smtp_port = 587
          smtp_user = "${{ secrets.SMTP_USER }}"
          smtp_password = "${{ secrets.SMTP_PASSWORD }}"
          EOF

      - name: Deploy through FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /preguntadospw2.infinityfreeapp.com/htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            config/config.local.ini
          retries: 3
          retryDelay: 10